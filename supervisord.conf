[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

; ── PostgreSQL 16 ────────────────────────────────────────────────────────────
[program:postgresql]
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/16/main
user=postgres
autostart=true
autorestart=true
priority=10
startsecs=5
stdout_logfile=/var/log/supervisor/postgresql.log
stderr_logfile=/var/log/supervisor/postgresql-error.log

; ── FastAPI Backend ──────────────────────────────────────────────────────────
[program:backend]
command=python3 -m uvicorn main:app --host 127.0.0.1 --port 8000
directory=/app
autostart=true
autorestart=true
priority=20
startsecs=3
stdout_logfile=/var/log/supervisor/backend.log
stderr_logfile=/var/log/supervisor/backend-error.log

; ── n8n Community Edition ────────────────────────────────────────────────────
[program:n8n]
command=n8n start
user=n8n
environment=
    N8N_HOST="127.0.0.1",
    N8N_PORT="5678",
    N8N_PROTOCOL="http",
    GENERIC_TIMEZONE="UTC",
    N8N_USER_FOLDER="/home/n8n/.n8n",
    WEBHOOK_URL="http://127.0.0.1:5678/"
autostart=true
autorestart=true
priority=20
startsecs=5
stdout_logfile=/var/log/supervisor/n8n.log
stderr_logfile=/var/log/supervisor/n8n-error.log

; ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
startsecs=2
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx-error.log
