version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: robocop-postgres
    environment:
      - POSTGRES_DB=malware_analysis
      - POSTGRES_USER=malware
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-malware_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - robocop-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U malware -d malware_analysis"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: robocop-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://malware:${POSTGRES_PASSWORD:-malware_dev_only}@postgres:5432/malware_analysis
      - UPLOAD_DIR=/app/uploads
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      - SHODAN_API_KEY=${SHODAN_API_KEY}
      - URLHAUS_AUTH_KEY=${URLHAUS_AUTH_KEY}
      - GOOGLE_SAFEBROWSING_API_KEY=${GOOGLE_SAFEBROWSING_API_KEY}
      - CHECKPHISH_API_KEY=${CHECKPHISH_API_KEY}
      - IPQUALITYSCORE_API_KEY=${IPQUALITYSCORE_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - API_KEY=${API_KEY:-change-this-in-production}
      - DEBUG=${DEBUG:-true}
      - N8N_WEBHOOK_BASE_URL=http://n8n:5678/webhook
      - NVD_API_KEY=${NVD_API_KEY}
      - DEFAULT_TLP_MARKING=${DEFAULT_TLP_MARKING:-TLP:AMBER}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./data/mitre_cache:/app/data/mitre_cache
      - ./data/threat_archive:/app/data/threat_archive
    depends_on:
      postgres:
        condition: service_healthy
      n8n:
        condition: service_started
    networks:
      - robocop-net
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: robocop-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - robocop-net
    restart: unless-stopped

  # n8n Community Edition (free, Sustainable Use License)
  # Pinned for reproducibility — update quarterly
  # Changelog: https://github.com/n8n-io/n8n/releases
  # NOTE: n8nio/n8n = community edition; n8nio/n8n-enterprise = paid enterprise
  n8n:
    image: n8nio/n8n:1.76.1
    container_name: robocop-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-change-this}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://n8n:5678/
      - GENERIC_TIMEZONE=UTC
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-change-this-key}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/workflows
    networks:
      - robocop-net
    restart: unless-stopped

  # ── All-in-One Container (single-container deployment) ───────────────────
  # Usage: docker compose --profile allinone up -d allinone
  # Runs PostgreSQL, FastAPI, n8n, and Nginx in a single container via supervisord
  allinone:
    profiles: ["allinone"]
    build:
      context: .
      dockerfile: Dockerfile.allinone
    container_name: robocop-allinone
    ports:
      - "3000:80"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - API_KEY=${API_KEY:-change-this-in-production}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-malware_dev_only}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      - SHODAN_API_KEY=${SHODAN_API_KEY}
      - URLHAUS_AUTH_KEY=${URLHAUS_AUTH_KEY}
      - GOOGLE_SAFEBROWSING_API_KEY=${GOOGLE_SAFEBROWSING_API_KEY}
      - CHECKPHISH_API_KEY=${CHECKPHISH_API_KEY}
      - IPQUALITYSCORE_API_KEY=${IPQUALITYSCORE_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - NVD_API_KEY=${NVD_API_KEY}
      - DEFAULT_TLP_MARKING=${DEFAULT_TLP_MARKING:-TLP:AMBER}
      - N8N_USER=${N8N_USER:-admin}
      - N8N_PASSWORD=${N8N_PASSWORD:-change-this}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-change-this-key}
      - DEBUG=${DEBUG:-false}
    volumes:
      - allinone_pgdata:/var/lib/postgresql/16/main
      - allinone_n8n:/home/n8n/.n8n
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped

volumes:
  postgres_data:
  n8n_data:
  allinone_pgdata:
  allinone_n8n:

networks:
  robocop-net:
    driver: bridge
