version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: malware-analysis-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/malware_analysis.db
      - UPLOAD_DIR=/app/uploads
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      - SHODAN_API_KEY=${SHODAN_API_KEY}
      - URLHAUS_AUTH_KEY=${URLHAUS_AUTH_KEY}
      - GOOGLE_SAFEBROWSING_API_KEY=${GOOGLE_SAFEBROWSING_API_KEY}
      - CHECKPHISH_API_KEY=${CHECKPHISH_API_KEY}
      - IPQUALITYSCORE_API_KEY=${IPQUALITYSCORE_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - API_KEY=${API_KEY:-change-this-in-production}
      - N8N_WEBHOOK_BASE_URL=http://n8n:5678/webhook
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    depends_on:
      - n8n
    networks:
      - malware-analysis-net
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: malware-analysis-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - malware-analysis-net
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: malware-analysis-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-change-this}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://n8n:5678/
      - GENERIC_TIMEZONE=UTC
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-change-this-key}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/workflows
    networks:
      - malware-analysis-net
    restart: unless-stopped

volumes:
  n8n_data:

networks:
  malware-analysis-net:
    driver: bridge
